<!DOCTYPE html>
<html lang="en">
   <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}EverydayRadius{% endblock %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            * { font-family: 'Inter', sans-serif; }
            body { background: #F5F3EF; margin: 0; }

            #app-sidebar {
                position: fixed;
                top: 0; left: 0;
                width: 210px;
                height: 100vh;
                background: #ffffff;
                border-right: 1px solid #E8E4DC;
                display: flex;
                flex-direction: column;
                z-index: 2000;
                padding: 24px 16px;
            }

            #app-sidebar .sidebar-logo {
                font-size: 1rem;
                font-weight: 600;
                color: #1C3C35;
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 32px;
                text-decoration: none;
            }

            #app-sidebar .sidebar-logo .logo-icon {
                width: 32px; height: 32px;
                background: #1C3C35;
                border-radius: 8px;
                display: flex; align-items: center; justify-content: center;
                color: white;
                font-size: 0.85rem;
            }

            #app-sidebar nav a {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 9px 12px;
                border-radius: 8px;
                color: #5C6B66;
                text-decoration: none;
                font-size: 0.875rem;
                font-weight: 500;
                margin-bottom: 2px;
            }

            #app-sidebar nav a:hover { background: #F5F3EF; color: #1C3C35; }
            #app-sidebar nav a.active { background: #EAF0EE; color: #1C3C35; font-weight: 600; }

            .sidebar-tagline {
                margin-top: auto;
                background: #F5F3EF;
                border-radius: 10px;
                padding: 14px;
                font-size: 0.8rem;
                color: #5C6B66;
            }
            .sidebar-tagline strong { display: block; color: #1C3C35; margin-bottom: 4px; font-size: 0.875rem; }

            #main-content {
                margin-left: 210px;
                min-height: 100vh;
            }
        </style>
        {% block extra_css %}{% endblock %}
   </head> 
   <body>
        <div id="app-sidebar">
            <a href="/" class="sidebar-logo">
                <div class="logo-icon">ER</div>
                EverydayRadius
            </a>
            <div class="sidebar-tagline">
                <strong>A little closer to local.</strong>
                The everyday places that make a neighbourhood yours.
            </div>
        </div>

        <div id="main-content">
            {% block content %}{% endblock %}
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        {% block extra_js %}{% endblock %}
   </body>
</html>
